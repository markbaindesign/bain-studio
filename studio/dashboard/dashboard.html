<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bain Design — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap');

:root {
  --paper: #E8DFCC;
  --paper-deep: #DDD2BB;
  --paper-pure: #FFFFFF;
  --ink: #141413;
  --graphite: #3D3D3A;
  --pencil: #8C8A85;
  --rule: #1F1F1D;
  --rule-soft: #D8D0C0;
  --clay: #C96442;
  --clay-deep: #A24E32;
  --clay-soft: #E8B59E;
  --link: #1A4FE3;
  --link-hover: #0E0E0E;
  --visited: #6B3FB7;
  --phosphor: #22C55E;
  --amber: #D89A2B;
  --vermilion: #C43D2F;
  --hover-bg: rgba(20,20,19,0.04);

  /* Semantic */
  --fg-1: var(--ink);
  --fg-2: var(--graphite);
  --fg-3: var(--pencil);
  --bg-1: var(--paper);
  --bg-2: var(--paper-pure);
  --border-1: var(--rule);
  --border-2: var(--rule-soft);

  /* Spacing (4px base grid) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Shadows */
  --shadow-press: 2px 2px 0 var(--ink);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
}

header {
  background: var(--paper-pure);
  border-bottom: 2px solid var(--rule);
  padding: var(--space-4) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
header h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
header h1::before {
  content: "♥";
  color: var(--clay);
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 2px;
  flex: 1;
  margin-left: var(--space-5);
}
.tab-btn {
  background: none;
  border: none;
  padding: var(--space-1) var(--space-3);
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-3);
  cursor: pointer;
  border-radius: 0;
  transition: background 120ms, color 120ms;
  border-bottom: 2px solid transparent;
}
.tab-btn:hover {
  background: var(--hover-bg);
  color: var(--fg-1);
}
.tab-btn.active {
  background: var(--ink);
  color: var(--paper-pure);
  border-bottom: 2px solid var(--clay);
}
.updated {
  font-size: 12px;
  color: var(--fg-3);
  margin-left: auto;
}
.refresh-btn {
  background: none;
  border: 1px solid var(--border-1);
  border-radius: 0;
  padding: var(--space-1) var(--space-2);
  font-size: 12px;
  color: var(--fg-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  transition: background 120ms, color 120ms;
}
.refresh-btn:hover {
  background: var(--hover-bg);
  color: var(--fg-1);
}
.refresh-btn.spinning svg {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.error-banner {
  background: rgba(196, 61, 47, 0.08);
  border-bottom: 1px solid var(--vermilion);
  padding: var(--space-2) var(--space-6);
  font-size: 12px;
  color: var(--vermilion);
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
  max-width: 1440px;
  margin: 0 auto;
}

.card {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  border-radius: 0;
  padding: var(--space-5);
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pencil);
  margin-bottom: 14px;
}
/* Exchange-rate subheader, shown on every Financial screen */
.fx-bar {
  font-size: 11px;
  color: var(--pencil);
  /* lines up with .grid below it, which supplies the gap to the cards */
  padding: var(--space-5) var(--space-6) 0;
  margin: 0 auto calc(-1 * var(--space-2));
  max-width: 1440px;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-4);
}
.fx-bar strong { color: var(--graphite); font-weight: 600; }
.fx-bar .fx-warn { color: var(--vermilion); }

.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pencil);
  grid-column: span 12;
  margin-top: 4px;
}

.col-3  { grid-column: span 3; }
.col-4  { grid-column: span 4; }
.col-5  { grid-column: span 5; }
.col-6  { grid-column: span 6; }
.col-7  { grid-column: span 7; }
.col-8  { grid-column: span 8; }
.col-12 { grid-column: span 12; }

/* Stat cards */
.stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); }
.stat-label { font-size: 12px; color: var(--pencil); margin-top: 4px; }
.stat-sub   { font-size: 12px; color: var(--pencil); margin-top: 6px; }

.positive { color: var(--phosphor); }
.negative { color: var(--vermilion); }
.warning  { color: var(--amber); }
.neutral  { color: var(--graphite); }

/* Skeleton loader */
.skel {
  background: linear-gradient(90deg, var(--paper-deep) 25%, var(--rule-soft) 50%, var(--paper-deep) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 0;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-text { height: 14px; margin: 6px 0; }
.skel-lg   { height: 32px; margin: 4px 0; }

/* Balance table */
.balance-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule-soft);
}
.balance-row:last-of-type { border-bottom: none; }
.balance-name   { color: var(--graphite); }
.balance-native { font-size: 11px; color: var(--pencil); text-align: right; }
.balance-eur    { font-weight: 700; text-align: right; color: var(--ink); }
.balance-total  {
  display: flex; justify-content: space-between;
  padding: 10px 0 0; margin-top: 6px;
  border-top: 2px solid var(--rule);
  font-weight: 700;
}
.balance-illiquid .balance-name,
.balance-illiquid .balance-eur { color: var(--pencil); font-style: italic; }
.balance-liquid-row { border-top: 1px solid var(--rule); margin-top: 2px; color: var(--phosphor); }

/* Upcoming payments */
.upcoming-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--rule-soft);
}
.upcoming-row:last-child { border-bottom: none; }
.ops-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ops-table th { text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #999; padding: 6px 10px 6px 0; border-bottom: 1px solid #e5e5df; }
.ops-table td { padding: 7px 10px 7px 0; border-bottom: 1px solid #f0f0ea; vertical-align: middle; }
.badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 0;
  white-space: nowrap; min-width: 52px; text-align: center;
  border: 1px solid currentColor;
}
.badge-urgent { background: transparent; border-color: var(--vermilion); color: var(--vermilion); }
.badge-soon   { background: transparent; border-color: var(--amber); color: var(--amber); }
.badge-later  { background: transparent; border-color: var(--phosphor); color: var(--phosphor); }
.up-label { flex: 1; color: var(--ink); font-weight: 500; }
.up-date  { font-size: 11px; color: var(--pencil); }
.up-amt   { font-weight: 700; min-width: 72px; text-align: right; color: var(--ink); }
.type-draw  { color: var(--clay); }
.type-tax   { color: var(--vermilion); }
.type-fixed { color: var(--ink); }

/* Projects */
.project-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--rule-soft);
}
.project-row:last-child { border-bottom: none; }
.project-name  { font-weight: 700; font-size: 13px; color: var(--ink); }
.project-client { font-size: 12px; color: var(--pencil); }
.project-right { margin-left: auto; text-align: right; }
.project-budget { font-size: 12px; color: var(--pencil); }
.budget-bar-wrap { margin-top: 3px; }
.budget-bar-track { height: 4px; background: var(--paper-deep); border-radius: 0; width: 120px; }
.budget-bar-fill  { height: 4px; border-radius: 0; background: var(--clay); }

/* Invoices */
.invoice-row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--rule-soft);
}
.invoice-row:last-child { border-bottom: none; }
.invoice-client { flex: 1; color: var(--ink); font-weight: 500; }
.invoice-num    { font-size: 11px; color: var(--pencil); }
.invoice-due    { font-size: 11px; color: var(--pencil); }
.invoice-amt    { font-weight: 700; color: var(--ink); }
.overdue-tag    { font-size: 10px; background: transparent; border: 1px solid var(--vermilion); color: var(--vermilion); padding: 1px 6px; border-radius: 0; }

/* Chart containers */
.chart-wrap { position: relative; }

/* Legend dots */
.legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--pencil); }
.dot { width: 8px; height: 8px; border-radius: 0; }

/* Empty state */
.empty { font-size: 13px; color: var(--pencil); padding: 12px 0; }

/* Harvest/Upwork not configured */
.not-configured {
  font-size: 12px; color: var(--pencil); padding: 20px 0;
  border: 1px solid var(--rule); border-radius: 0;
  text-align: center;
}

/* KF time budget */
.kf-progress-track {
  height: 8px; background: var(--paper-deep); border-radius: 0;
  margin: 12px 0 6px;
}
.kf-progress-fill {
  height: 8px; border-radius: 0; transition: width 0.4s ease; background: var(--clay);
}
.kf-target-marker {
  position: relative;
}
.kf-target-line {
  position: absolute; top: -10px; width: 2px; background: var(--rule);
  height: 28px; border-radius: 0;
}
.month-row {
  display: grid;
  grid-template-columns: 52px 1fr 64px 64px 72px;
  gap: 8px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 12px;
}
.month-row:last-child { border-bottom: none; }
.month-bar-track { height: 4px; background: var(--paper-deep); border-radius: 0; }
.month-bar-fill  { height: 4px; border-radius: 0; background: var(--clay); }

/* Pipeline */
.funnel-step { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; }
.funnel-count { font-size: 22px; font-weight: 700; min-width: 36px; color: var(--ink); }
.funnel-label { font-size: 12px; color: var(--pencil); }
.funnel-arrow { padding-left: 8px; font-size: 13px; color: var(--pencil); line-height: 1; }

.outcome-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
}
.outcome-cell { text-align: center; padding: 8px 4px; background: var(--paper-deep); border-radius: 0; border: 1px solid var(--rule-soft); }
.outcome-val  { font-size: 20px; font-weight: 700; line-height: 1.2; color: var(--ink); }
.outcome-lbl  { font-size: 10px; color: var(--pencil); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

.pipeline-hdr {
  display: grid; grid-template-columns: 1fr 90px 44px 90px 64px;
  gap: 10px; padding: 0 0 8px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--pencil);
}
.pipeline-row {
  display: grid; grid-template-columns: 1fr 90px 44px 90px 64px;
  gap: 10px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px;
}
.pipeline-row:last-child { border-bottom: none; }
.pipeline-title a { color: var(--link); text-decoration: none; }
.pipeline-title a:hover { text-decoration: underline; }
.pipeline-budget { font-size: 12px; color: #888; }
.score-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 600;
}
.score-high {
  background: rgba(34, 197, 94, 0.1);
  color: var(--phosphor);
}
.score-mid {
  background: rgba(216, 154, 43, 0.1);
  color: var(--amber);
}
.score-low {
  background: rgba(196, 61, 47, 0.1);
  color: var(--vermilion);
}
.status-pill {
  font-size: 10px;
  font-weight: 600;
  padding: var(--space-1) var(--space-2);
  border-radius: 10px;
  white-space: nowrap;
  display: inline-block;
}
.status-pending {
  background: var(--hover-bg);
  color: var(--fg-3);
}
.status-nudged {
  background: rgba(26, 79, 227, 0.08);
  color: var(--link);
}
.status-proposal {
  background: rgba(34, 197, 94, 0.1);
  color: var(--phosphor);
}
.pipeline-age {
  font-size: 11px;
  color: var(--fg-3);
  text-align: right;
}

/* Connects badge + inline edit */
.connects-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 11px;
  font-weight: 600;
  padding: var(--space-1) var(--space-2);
  border-radius: 10px;
  background: var(--hover-bg);
  color: var(--fg-2);
  cursor: pointer;
  white-space: nowrap;
  border: 1px solid transparent;
  transition: background 120ms, border-color 120ms;
}
.connects-badge:hover {
  border-color: var(--rule-soft);
  background: var(--paper-deep);
}
.connects-badge.edited {
  background: rgba(26, 79, 227, 0.08);
  color: var(--link);
}
.connects-edit-wrap {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
}
.connects-input {
  width: 42px;
  padding: var(--space-1) var(--space-2);
  font-size: 12px;
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  text-align: center;
  font-family: inherit;
}
.connects-save, .connects-cancel {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  padding: 0 var(--space-1);
  line-height: 1;
}
.connects-save {
  color: var(--phosphor);
}
.connects-cancel {
  color: var(--vermilion);
}

/* Briefs integrated table */
.briefs-hdr, .briefs-row {
  display: grid;
  grid-template-columns: 1fr 84px 44px 100px 58px 68px 68px;
  gap: var(--space-3);
  align-items: center;
}
.briefs-hdr {
  padding: 0 0 var(--space-2);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-3);
}
.briefs-row {
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
}
.briefs-row:last-child {
  border-bottom: none;
}
.briefs-title a {
  color: var(--fg-1);
  text-decoration: none;
  transition: color 120ms;
}
.briefs-title a:hover {
  color: var(--link);
  text-decoration: underline;
}
.briefs-dim {
  font-size: 11px;
  color: var(--fg-3);
  text-align: right;
}

/* Status pill variants */
.status-won {
  background: rgba(34, 197, 94, 0.1);
  color: var(--phosphor);
}
.status-lost {
  background: rgba(196, 61, 47, 0.1);
  color: var(--vermilion);
}
.status-rejected {
  background: rgba(196, 61, 47, 0.1);
  color: var(--vermilion);
}
.status-interview {
  background: rgba(201, 100, 66, 0.1);
  color: var(--clay);
}
.status-waiting {
  background: rgba(216, 154, 43, 0.1);
  color: var(--amber);
}

/* Filter bar */
.filter-bar {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.filter-chip {
  font-size: 11px;
  padding: var(--space-1) var(--space-2);
  border-radius: 12px;
  border: 1px solid var(--rule-soft);
  background: none;
  color: var(--fg-2);
  cursor: pointer;
  transition: background 120ms, color 120ms, border-color 120ms;
}
.filter-chip:hover {
  background: var(--hover-bg);
  color: var(--fg-1);
}
.filter-chip.active {
  background: var(--ink);
  color: var(--paper-pure);
  border-color: var(--ink);
}
.filter-sep {
  width: 1px;
  background: var(--rule-soft);
  margin: 0 var(--space-1);
  align-self: stretch;
}

.days-toggle {
  display: flex;
  gap: var(--space-1);
}
.days-btn {
  font-size: 10px;
  padding: var(--space-1) var(--space-2);
  border-radius: 10px;
  border: 1px solid var(--rule-soft);
  background: none;
  color: var(--fg-2);
  cursor: pointer;
  transition: background 120ms, color 120ms, border-color 120ms;
}
.days-btn:hover {
  background: var(--hover-bg);
  color: var(--fg-1);
}
.days-btn.active {
  background: var(--ink);
  color: var(--paper-pure);
  border-color: var(--ink);
}

/* Sidebar sub-navigation: every tab has one, listing that tab's screens */
.app-body { display: flex; align-items: flex-start; }
#pages { flex: 1; min-width: 0; }
.subnav {
  width: 176px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  padding: var(--space-5) 0 var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.subnav-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pencil);
  padding: 0 var(--space-3) var(--space-2);
}
.subnav-btn {
  text-align: left;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  padding: 6px var(--space-3);
  font: inherit;
  font-size: 12px;
  color: var(--fg-3);
  cursor: pointer;
  transition: background 120ms, color 120ms;
}
.subnav-btn:hover { background: var(--hover-bg); color: var(--fg-1); }
.subnav-btn.active {
  color: var(--ink);
  font-weight: 700;
  background: var(--paper-pure);
  border-left-color: var(--clay);
}

/* Cashflow + Configs screens */
.table-scroll { overflow-x: auto; }
.ops-table th.num, .ops-table td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ops-table tr.shortfall td { background: rgba(196, 61, 47, 0.08); }
.ops-table td.cell-wrap { white-space: normal; word-break: break-word; }
.table-scroll > .ops-table { min-width: 560px; }
.tier {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border: 1px solid var(--rule-soft);
  white-space: nowrap;
  color: var(--graphite);
}
.tier-receivable, .tier-unbilled, .tier-fixed { border-color: var(--phosphor); color: #15803d; }
.tier-predicted, .tier-milestone { border-color: var(--amber); color: #9a6a12; }
.tier-transfer { border-color: var(--link); color: var(--link); }
.cfg-meta { font-size: 11px; color: var(--pencil); margin: -8px 0 var(--space-4); }
.cfg-desc { font-size: 12px; color: var(--graphite); margin-bottom: var(--space-4); max-width: 80ch; }
.cfg-section { font-size: 12px; font-weight: 700; margin: var(--space-4) 0 var(--space-2); }
.cfg-section:first-of-type { margin-top: 0; }
.cfg-none { font-size: 12px; color: var(--pencil); }
.note { font-size: 12px; color: var(--graphite); }
.note-warn { color: var(--vermilion); font-weight: 700; }

@media (max-width: 1100px) {
  .col-3, .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 6; }
  .pipeline-hdr, .pipeline-row { grid-template-columns: 1fr 80px 44px 80px 60px; }
  .briefs-hdr, .briefs-row { grid-template-columns: 1fr 80px 44px 96px 58px 64px; }
  .briefs-hdr span:last-child, .briefs-row .briefs-dim:last-child { display: none; }
}
@media (max-width: 700px) {
  .app-body { flex-direction: column; }
  .subnav {
    position: static; width: 100%; flex-direction: row; overflow-x: auto;
    padding: var(--space-3) var(--space-3) 0;
  }
  .subnav-title { display: none; }
  .subnav-btn { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; }
  .subnav-btn.active { border-bottom-color: var(--clay); }
  .col-3, .col-4, .col-5, .col-6, .col-7, .col-8, .col-12 { grid-column: span 12; }
  .grid { padding: var(--space-3); }
  .fx-bar { padding: var(--space-3) var(--space-3) 0; margin-bottom: 0; }
  header { padding: var(--space-3) var(--space-4); }
  .pipeline-hdr, .pipeline-row { grid-template-columns: 1fr 44px 80px 56px; }
  .pipeline-hdr span:nth-child(2), .pipeline-row .pipeline-budget { display: none; }
  .briefs-hdr, .briefs-row { grid-template-columns: 1fr 44px 96px 58px; }
  .briefs-hdr span:nth-child(2), .briefs-row .briefs-budget,
  .briefs-hdr span:nth-child(6), .briefs-hdr span:nth-child(7) { display: none; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let plChart, donutChart, beChart;
let currentTab = 'finance';
let pipelineDays = 7;

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------

const TABS = ['highlights', 'finance', 'kf', 'pipeline', 'ops'];

// Each tab's screens, listed in its sidebar. 'overview' is the tab's original page
// (#page-<tab>); any other screen lives in #page-<tab>-<screen>.
const SCREENS = {
  highlights: [['overview', 'Overview']],
  finance:    [['overview', 'Overview'], ['cashflow', 'Cashflow'], ['configs', 'Configs']],
  kf:         [['overview', 'Overview']],
  pipeline:   [['overview', 'Overview']],
  ops:        [['overview', 'Overview']],
};
const TAB_LABELS = { highlights: 'Highlights', finance: 'Financial', kf: 'KF Time Budget', pipeline: 'Pipeline', ops: 'Ops' };
let currentScreen = 'overview';

function pageId(tab, screen) {
  return screen === 'overview' ? `page-${tab}` : `page-${tab}-${screen}`;
}

function parseHash() {
  const raw = location.hash.replace(/^#/, '') || 'highlights';
  const [path, qs] = raw.split('?');
  let [tab, screen] = path.split('/');
  const params = {};
  if (qs) new URLSearchParams(qs).forEach((v, k) => { params[k] = v; });
  if (!TABS.includes(tab)) tab = 'highlights';
  if (!SCREENS[tab].some(([id]) => id === screen)) screen = 'overview';
  return { tab, screen, params };
}

function buildHash(tab, params, screen = 'overview') {
  const defaults = { status: 'all', score: 'all', days: '7', scenario: 'base' };
  const qs = new URLSearchParams(
    Object.entries(params).filter(([k, v]) => v !== defaults[k])
  ).toString();
  return '#' + tab + (screen !== 'overview' ? '/' + screen : '') + (qs ? '?' + qs : '');
}

function navigate(tab, newParams = {}, screen = 'overview') {
  const cur = parseHash();
  const same = cur.tab === tab && cur.screen === screen;
  const params = same ? { ...cur.params, ...newParams } : newParams;
  history.pushState(null, '', buildHash(tab, params, screen));
  onHashChange();
}

function renderSubnav(tab, screen) {
  document.getElementById('subnav').innerHTML =
    `<div class="subnav-title">${TAB_LABELS[tab]}</div>` +
    SCREENS[tab].map(([id, label]) =>
      `<button class="subnav-btn ${id === screen ? 'active' : ''}" onclick="switchScreen('${id}')">${label}</button>`
    ).join('');
}

function onHashChange() {
  const { tab, screen, params } = parseHash();
  const prevTab    = currentTab;
  const prevScreen = currentScreen;
  const prevDays   = pipelineDays;

  pipelineDays         = parseInt(params.days   || '7',   10);
  pipelineStatusFilter = params.status || 'all';
  pipelineScoreFilter  = params.score  || 'all';
  currentTab = tab;
  currentScreen = screen;

  TABS.forEach(t => {
    SCREENS[t].forEach(([s]) => {
      document.getElementById(pageId(t, s)).style.display = (t === tab && s === screen) ? '' : 'none';
    });
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  renderSubnav(tab, screen);
  document.getElementById('fxBar').style.display = tab === 'finance' ? '' : 'none';
  if (tab === 'finance') loadFx();

  if (tab === 'finance' && screen === 'cashflow') {
    loadCashflow(params.scenario || 'base');
  } else if (tab === 'finance' && screen === 'configs') {
    loadConfigs();
  } else if (tab === 'highlights') {
    loadHighlights();
  } else if (tab === 'kf') {
    loadKF();
  } else if (tab === 'ops') {
    loadOps();
  } else if (tab === 'pipeline') {
    const needFetch = prevTab !== 'pipeline' || prevScreen !== screen || pipelineDays !== prevDays || !_pipelineBriefs.length;
    if (needFetch) {
      loadPipeline();
    } else {
      // Filter change only — update chips and re-render, no network call
      document.querySelectorAll('[data-sf]').forEach(b =>
        b.classList.toggle('active', b.dataset.sf === pipelineStatusFilter));
      document.querySelectorAll('[data-scf]').forEach(b =>
        b.classList.toggle('active', b.dataset.scf === pipelineScoreFilter));
      renderBriefsTable(_pipelineBriefs);
    }
  } else {
    loadData();
  }
}

// Exchange-rate subheader for the Financial tab. Every screen converts USD/GBP to
// EUR with these rates, so they're always shown alongside the figures.
function renderFxBar(fx) {
  const live = /^frankfurter/.test(fx.source || '');
  const r = v => '€' + v.toFixed(4);
  document.getElementById('fxBar').innerHTML = `
    <span>Exchange rates</span>
    <span><strong>1 USD = ${r(fx.USD_TO_EUR)}</strong></span>
    <span><strong>1 GBP = ${r(fx.GBP_TO_EUR)}</strong></span>
    <span class="${live ? '' : 'fx-warn'}">${fx.source || ''}</span>`;
}
async function loadFx() {
  try {
    const res = await fetch('/api/fx');
    if (res.ok) renderFxBar(await res.json());
  } catch (e) { /* bar keeps its last rates */ }
}

function switchTab(tab) { navigate(tab); }
function switchScreen(screen) { navigate(currentTab, {}, screen); }

function refreshCurrent() {
  const { tab, screen, params } = parseHash();
  if (tab === 'finance' && screen === 'cashflow') loadCashflow(params.scenario || 'base');
  else if (tab === 'finance' && screen === 'configs') loadConfigs();
  else if (tab === 'highlights') loadHighlights();
  else if (tab === 'kf') loadKF();
  else if (tab === 'ops') loadOps();
  else if (tab === 'pipeline') loadPipeline();
  else loadData();
}

function fmt(n, digits=0) {
  if (n === null || n === undefined) return '—';
  return '€' + Math.abs(n).toLocaleString('en-GB', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function fmtSigned(n) {
  if (n === null || n === undefined) return '—';
  return (n >= 0 ? '+' : '−') + '€' + Math.abs(n).toLocaleString('en-GB', { maximumFractionDigits: 0 });
}
function fmtNative(bal, cur) {
  const sym = cur === 'USD' ? '$' : cur === 'GBP' ? '£' : '€';
  return sym + Math.abs(bal).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function badgeClass(days) {
  if (days <= 7)  return 'badge-urgent';
  if (days <= 30) return 'badge-soon';
  return 'badge-later';
}
function badgeDays(days) {
  if (days === 0) return 'Today';
  if (days === 1) return '1 day';
  return `${days} days`;
}
function typeClass(type) {
  return `type-${type}`;
}
function shortMonth(m) {
  const [y, mo] = m.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(mo)-1] + ' ' + y.slice(2);
}
function isOverdue(due_date) {
  return due_date && due_date < new Date().toISOString().slice(0,10);
}

function renderKPIs(g, h) {
  const liquid = g.liquid_eur != null ? g.liquid_eur : g.total_eur;
  const cashClass = liquid < 2000 ? 'negative' : liquid < 4000 ? 'warning' : 'positive';

  // Last 3 months avg income (exclude current month if incomplete)
  const pl = g.monthly_pl || [];
  const today = new Date();
  const curMonth = today.toISOString().slice(0,7);
  const recent = pl.filter(m => m.month < curMonth).slice(-3);
  const avgInc = recent.length ? recent.reduce((s,m) => s + m.income, 0) / recent.length : 0;
  const bufferVsBE = avgInc - g.breakeven_allin;
  const bufferClass = bufferVsBE >= 0 ? 'positive' : 'negative';

  // Upcoming month totals
  // Bills only: `upcoming` also carries forecast income (type 'income').
  const upcoming = (g.upcoming || []).filter(u => u.type !== 'income');
  const thisMonthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().slice(0,10);
  const nextMonthEnd = new Date(today.getFullYear(), today.getMonth() + 2, 0).toISOString().slice(0,10);
  const thisMo = upcoming.filter(u => u.date <= thisMonthEnd).reduce((s,u) => s + u.amount, 0);
  const nextMo = upcoming.filter(u => u.date > thisMonthEnd && u.date <= nextMonthEnd).reduce((s,u) => s + u.amount, 0);

  // Harvest earnings
  const earn = (h && h.earnings) || {};
  const todayEur   = (earn.today      || {}).eur   || 0;
  const weekEur    = (earn.this_week  || {}).eur   || 0;
  const monthEur   = (earn.this_month || {}).eur   || 0;
  const weekHours  = (earn.this_week  || {}).hours || 0;
  const monthHours = (earn.this_month || {}).hours || 0;
  const harvestOk  = h && h.projects !== undefined && !h.error;

  return `
    <div class="card col-3">
      <div class="card-title">Cash on Hand</div>
      <div class="stat-value ${cashClass}">${fmt(liquid)}</div>
      <div class="stat-label">Liquid EUR (excl. Suspense / Future Assets)</div>
      <div class="stat-sub ${bufferClass}">Break-even ${fmt(g.breakeven_allin)}/mo · avg ${fmt(avgInc)} · ${fmtSigned(bufferVsBE)}</div>
    </div>
    <div class="card col-3">
      <div class="card-title">Harvest — This Month</div>
      ${harvestOk
        ? `<div class="stat-value positive">${fmt(monthEur)}</div>
           <div class="stat-label">${monthHours}h billable logged</div>
           <div class="stat-sub neutral">This week ${fmt(weekEur)} (${weekHours}h) &middot; Today ${fmt(todayEur)}</div>`
        : `<div class="not-configured" style="margin-top:8px">Add Harvest keys to .env</div>`
      }
    </div>
    <div class="card col-3">
      <div class="card-title">Due This Month</div>
      <div class="stat-value ${thisMo > liquid ? 'negative' : 'warning'}">${fmt(thisMo)}</div>
      <div class="stat-label">Upcoming payments before month end</div>
      <div class="stat-sub ${liquid - thisMo > 0 ? 'positive' : 'negative'}">After payments: ${fmt(liquid - thisMo)}</div>
    </div>
    <div class="card col-3">
      <div class="card-title">Due Next Month</div>
      <div class="stat-value warning">${fmt(nextMo)}</div>
      <div class="stat-label">Projected outgoings next month</div>
    </div>
  `;
}

function renderBalances(balances, total_eur, liquid_eur) {
  const rows = balances.map(b => `
    <div class="balance-row${b.liquid === false ? ' balance-illiquid' : ''}">
      <span class="balance-name">${b.name}</span>
      <div>
        ${b.currency !== 'EUR' ? `<div class="balance-native">${fmtNative(b.balance, b.currency)}</div>` : ''}
        <div class="balance-eur">${fmt(b.eur)}</div>
      </div>
    </div>
  `).join('');
  const liquidRow = (liquid_eur != null && liquid_eur !== total_eur)
    ? `<div class="balance-total balance-liquid-row"><span>Liquid</span><span>${fmt(liquid_eur)}</span></div>`
    : '';
  return `
    <div class="card col-4">
      <div class="card-title">Account Balances</div>
      ${rows}
      ${liquidRow}
      <div class="balance-total"><span>Total (all)</span><span>${fmt(total_eur)}</span></div>
    </div>
  `;
}

function renderUpcoming(upcoming) {
  if (!upcoming || !upcoming.length) {
    return '<div class="card col-4"><div class="card-title">Upcoming Payments</div><div class="empty">No upcoming payments found.</div></div>';
  }
  const rows = upcoming.slice(0, 12).map(u => `
    <div class="upcoming-row">
      <span class="badge ${badgeClass(u.days)}">${badgeDays(u.days)}</span>
      <span class="up-label">${u.label}</span>
      <span class="up-date">${u.date.slice(5).replace('-', ' ')}</span>
      <span class="up-amt ${typeClass(u.type)}">${fmt(u.amount)}</span>
    </div>
  `).join('');

  const legend = `
    <div class="legend" style="margin-top:12px;padding-top:10px;border-top:1px solid #f0f0eb;">
      <div class="legend-item"><span class="dot" style="background:#7c3aed"></span>Draw</div>
      <div class="legend-item"><span class="dot" style="background:#c0392b"></span>Tax</div>
      <div class="legend-item"><span class="dot" style="background:#1a1a1a"></span>Fixed</div>
    </div>`;

  return `
    <div class="card col-4">
      <div class="card-title">Upcoming Payments</div>
      ${rows}
      ${legend}
    </div>
  `;
}

function renderHarvestProjects(harvest) {
  if (!harvest || harvest.configured === false) {
    return `
      <div class="card col-4">
        <div class="card-title">Active Projects (Harvest)</div>
        <div class="not-configured">Add HARVEST_TOKEN + HARVEST_ACCOUNT_ID to .env to enable</div>
      </div>`;
  }
  if (harvest.error) {
    return `
      <div class="card col-4">
        <div class="card-title">Active Projects (Harvest)</div>
        <div class="not-configured" style="color:#c0392b;">Harvest error: ${harvest.error}</div>
      </div>`;
  }
  const projects = (harvest.projects || []).filter(p => p.is_billable);
  if (!projects.length) {
    return `
      <div class="card col-4">
        <div class="card-title">Active Projects (Harvest)</div>
        <div class="empty">No active billable projects.</div>
      </div>`;
  }
  const rows = projects.map(p => {
    const pct = p.budget_pct || 0;
    const barColor = pct > 90 ? '#c0392b' : pct > 70 ? '#d97706' : '#2d8a4e';
    const budgetStr = p.budget
      ? `${fmt(p.budget_spent)} of ${fmt(p.budget)} (${p.budget_pct}%)`
      : 'No budget set';
    return `
      <div class="project-row">
        <div>
          <div class="project-name">${p.name}</div>
          <div class="project-client">${p.client}</div>
          ${p.budget ? `<div class="budget-bar-wrap">
            <div class="budget-bar-track">
              <div class="budget-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div>
            </div>
          </div>` : ''}
        </div>
        <div class="project-right">
          <div class="project-budget">${budgetStr}</div>
          ${p.budget_remaining !== null ? `<div style="font-size:12px;color:#2d8a4e">${fmt(p.budget_remaining)} left</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const uninvoiced = harvest.uninvoiced || {};
  const uninvoicedStr = (uninvoiced.total_eur > 0 || (uninvoiced.partial || []).length > 0)
    ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid #f0f0eb;font-size:12px;color:#888;">
        ${uninvoiced.total_eur > 0 ? `<div>Ready to invoice: <strong style="color:#2d8a4e">${fmt(uninvoiced.total_eur)}</strong></div>
        ${(uninvoiced.by_project || []).map(p => `<div style="margin-top:3px;padding-left:8px;">${p.client} — ${p.currency} ${p.uninvoiced} (${fmt(p.uninvoiced_eur)})</div>`).join('')}` : ''}
        ${(uninvoiced.partial || []).length > 0 ? `<div style="margin-top:6px;color:#aaa;">Hours logged, already partially invoiced (fixed-fee):</div>
        ${(uninvoiced.partial || []).map(p => `<div style="margin-top:3px;padding-left:8px;color:#bbb;">${p.client} — ${p.uninvoiced_hrs}h (${fmt(p.uninvoiced_eur)})</div>`).join('')}` : ''}
       </div>`
    : '';

  return `
    <div class="card col-4">
      <div class="card-title">Active Projects (Harvest)</div>
      ${rows}
      ${uninvoicedStr}
    </div>`;
}

function renderInvoices(harvest) {
  if (!harvest || harvest.configured === false || harvest.error) return '';
  const invoices = harvest.invoices || [];
  if (!invoices.length) {
    return `
      <div class="card col-4">
        <div class="card-title">Outstanding Invoices (Harvest)</div>
        <div class="empty">No open invoices.</div>
      </div>`;
  }
  const today = new Date().toISOString().slice(0,10);
  const rows = invoices.map(inv => {
    const od = inv.due_date && inv.due_date < today;
    return `
      <div class="invoice-row">
        <div>
          <div class="invoice-client">${inv.client} <span class="invoice-num">#${inv.number}</span></div>
          <div class="invoice-due">Due ${inv.due_date || '—'} ${od ? '<span class="overdue-tag">overdue</span>' : ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="invoice-amt ${od ? 'negative' : ''}">${inv.currency === 'EUR' ? fmt(inv.due_amount) : `${fmtNative(inv.due_amount, inv.currency)} <span class="invoice-due">≈ ${fmt(inv.due_amount_eur)}</span>`}</div>
          ${inv.due_amount !== inv.amount ? `<div class="invoice-due">of ${fmtNative(inv.amount, inv.currency)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const total = harvest.invoice_total || 0;
  return `
    <div class="card col-4">
      <div class="card-title">Outstanding Invoices (Harvest)</div>
      ${rows}
      <div class="balance-total"><span>Total receivable</span><span>${fmt(total)}</span></div>
    </div>`;
}

function renderPLChart(monthly_pl) {
  const labels = monthly_pl.map(m => shortMonth(m.month));
  const income  = monthly_pl.map(m => m.income);
  const outgoings = monthly_pl.map(m => m.expenses + m.draw);
  const be = monthly_pl.map(() => 4115);

  if (plChart) plChart.destroy();
  const ctx = document.getElementById('plChart').getContext('2d');
  plChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Income', data: income, backgroundColor: 'rgba(45,138,78,0.72)', borderRadius: 3, order: 2 },
        { label: 'Outgoings (exp + draw)', data: outgoings, backgroundColor: 'rgba(192,57,43,0.62)', borderRadius: 3, order: 2 },
        { label: 'Break-even', data: be, type: 'line', borderColor: '#1a1a1a', borderWidth: 1.5, borderDash: [4,3], pointRadius: 0, fill: false, order: 1 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: €${c.parsed.y.toLocaleString('en-GB', {maximumFractionDigits:0})}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { grid: { color: '#f0f0eb' }, ticks: { font: { size: 11 }, callback: v => '€' + (v/1000).toFixed(0) + 'k' } }
      }

function renderDonut(cat_exp) {
  const exclude = ['Taxes', 'Bad Debt'];
  const entries = Object.entries(cat_exp)
    .filter(([k]) => !exclude.includes(k))
    .sort((a, b) => b[1] - a[1]);
  const labels = entries.map(([k]) => k);
  const vals   = entries.map(([, v]) => Math.round(v));
  const colors = ['#4f86c6','#6db8a0','#e8a87c','#9b7ec8','#e8c97c','#7cb8e8','#e87c9b','#a0c8a0','#c8a07c','#b8b8a0'];

  if (donutChart) donutChart.destroy();
  const ctx = document.getElementById('donutChart').getContext('2d');
  donutChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: vals, backgroundColor: colors.slice(0, vals.length), borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 }, padding: 8 } },
        tooltip: {
          callbacks: {
            label: c => {
              const total = vals.reduce((a,b)=>a+b,0);
              return ` €${c.parsed.toLocaleString('en-GB')} (${Math.round(c.parsed/total*100)}%)`;
            }
          }
        }
      }
    }
  });
}

function fmtHours(h) {
  return h === null || h === undefined ? '—' : h.toFixed(1) + 'h';
}

function renderKFPage(d) {
  const monthlyTarget  = d.paced_monthly_target ?? d.monthly_hours_target;
  const annualBase     = d.annual_hours_target;
  const annualAdj      = d.adjusted_annual_target ?? annualBase;
  const carryOver      = d.carry_over_hours ?? 0;
  const carryFromYear  = d.carry_over_from_year;
  const prevLogged     = d.prev_year_logged;
  const prevTarget     = d.prev_year_target;
  const yearLogged     = d.year_hours_logged;
  const adjTargetToDate = d.year_target_to_date;
  const yearVar        = d.year_variance;
  const monthLogged    = d.month_hours_logged;
  const monthVar       = d.month_variance;
  const months         = d.months_elapsed;
  const curMonth       = d.current_month;
  const mName          = new Date(curMonth + '-01').toLocaleString('en-GB', { month: 'long' });

  const yearPct   = Math.min(yearLogged / annualAdj * 100, 100);
  const targetPct = Math.min(adjTargetToDate / annualAdj * 100, 100);
  const monthPct  = Math.min(monthLogged / monthlyTarget * 100, 100);

  const yearDir   = yearVar >= 0 ? 'ahead of' : 'behind';
  const monthDir  = monthVar >= 0 ? 'ahead of' : 'behind';
  const yearCls   = yearVar >= 0 ? 'positive' : 'negative';
  const monthCls  = monthVar >= 0 ? 'positive' : 'negative';
  const yearBarColor  = yearVar >= 0 ? '#2d8a4e' : '#c0392b';
  const monthBarColor = monthVar >= 0 ? '#2d8a4e' : '#c0392b';

  // Monthly breakdown rows
  const byMonth = d.by_month || {};
  const allMonths = [];
  for (let m = 1; m <= 12; m++) {
    const key = `${d.year}-${String(m).padStart(2,'0')}`;
    allMonths.push(key);
  }
  const today = new Date().toISOString().slice(0,7);
  const monthRows = allMonths.map(key => {
    const mn = new Date(key + '-01').toLocaleString('en-GB', { month: 'short' });
    const logged = byMonth[key] || 0;
    const isFuture = key > today;
    const isCurrentMonth = key === curMonth;
    if (isFuture) {
      return `<div class="month-row" style="opacity:0.35">
        <span style="font-weight:500">${mn}</span>
        <div class="month-bar-track"></div>
        <span style="color:#bbb">—</span>
        <span style="color:#bbb">${fmtHours(monthlyTarget)}</span>
        <span style="color:#bbb">—</span>
      </div>`;
    }
    const pct = Math.min(logged / monthlyTarget * 100, 100);
    const v   = logged - monthlyTarget;
    const vc  = v >= 0 ? 'positive' : 'negative';
    const bc  = v >= 0 ? '#2d8a4e' : '#c0392b';
    return `<div class="month-row" style="${isCurrentMonth ? 'font-weight:600' : ''}">
      <span>${mn}${isCurrentMonth ? ' ●' : ''}</span>
      <div class="month-bar-track"><div class="month-bar-fill" style="width:${pct}%;background:${bc}"></div></div>
      <span>${fmtHours(logged)}</span>
      <span style="color:#aaa">${fmtHours(monthlyTarget)}</span>
      <span class="${vc}">${v >= 0 ? '+' : ''}${fmtHours(v)}</span>
    </div>`;
  }).join('');

  const ts = new Date(d.generated_at);
  document.getElementById('updatedAt').textContent =
    'Updated ' + ts.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  // Month ticks + labels for year bar
  const mnShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ticks = Array.from({length: 11}, (_, i) => {
    const pct = (i + 1) / 12 * 100;
    return `<div style="position:absolute;top:0;left:${pct}%;width:1px;height:8px;background:#d0d0ca;transform:translateX(-50%)"></div>`;
  }).join('');
  const labels = mnShort.map((mn, i) => {
    const pct = (i + 0.5) / 12 * 100;
    const isCur = (i + 1) === months;
    return `<div style="position:absolute;left:${pct}%;transform:translateX(-50%);font-size:10px;color:${isCur ? '#1a1a1a' : '#bbb'};font-weight:${isCur ? '600' : '400'};white-space:nowrap;">${mn}</div>`;
  }).join('');

  const carryOverHtml = carryOver !== 0 ? (() => {
    const coSign  = carryOver < 0 ? 'positive' : 'negative';
    const coLabel = carryOver < 0 ? 'credit' : 'owed';
    const coSign2 = carryOver < 0 ? '−' : '+';
    return `<div style="margin:10px 0 4px;padding:8px 10px;background:#f7f7f3;border-radius:6px;font-size:12px;line-height:1.6;">
      <span style="color:#888;">${carryFromYear} carry-over:</span>
      <span class="${coSign}" style="margin-left:6px;font-weight:600;">${coSign2}${fmtHours(Math.abs(carryOver))} ${coLabel}</span>
      <span style="color:#bbb;font-size:11px;margin-left:6px;">(logged ${fmtHours(prevLogged)} of ${fmtHours(prevTarget)})</span><br>
      <span style="color:#aaa;">Adjusted target: ${fmtHours(annualBase)} ${coSign2} ${fmtHours(Math.abs(carryOver))} = </span>
      <strong>${fmtHours(annualAdj)}</strong>
    </div>`;
  })() : '';

  document.getElementById('kfGrid').innerHTML = `
    <div class="card col-6">
      <div class="card-title">Year ${d.year} — Annual Budget</div>
      <div class="stat-value ${yearCls}">${fmtHours(yearLogged)}</div>
      <div class="stat-label">of ${fmtHours(annualAdj)} adjusted target (${d.rate_usd * annualAdj | 0} USD)</div>
      ${carryOverHtml}
      <div style="position:relative;margin:16px 0 32px;">
        <div class="kf-progress-track" style="margin:0;">
          <div class="kf-progress-fill" style="width:${yearPct}%;background:${yearBarColor}"></div>
        </div>
        ${ticks}
        <div style="position:absolute;top:10px;left:0;right:0;height:16px;">${labels}</div>
        <div style="position:absolute;top:-6px;left:${targetPct}%;width:2px;height:28px;background:#aaa;border-radius:1px;transform:translateX(-50%)"></div>
      </div>
      <div style="font-size:11px;color:#aaa;margin-bottom:12px;">
        Adjusted target to date (${months} months): ${fmtHours(adjTargetToDate)}
        <span style="float:right;font-size:11px;color:#bbb">▲ target marker</span>
      </div>
      <div class="stat-sub ${yearCls}" style="font-size:14px;">
        ${fmtHours(Math.abs(yearVar))} ${yearDir} target
      </div>
    </div>

    <div class="card col-6">
      <div class="card-title">${mName} — Monthly Target (Paced)</div>
      <div class="stat-value ${monthCls}">${fmtHours(monthLogged)}</div>
      <div class="stat-label">of ${fmtHours(monthlyTarget)} paced target</div>
      <div style="font-size:11px;color:#aaa;margin:4px 0 10px;">
        (${fmtHours(annualAdj)} remaining ÷ ${d.months_remaining} months left)
        · base rate ${fmtHours(d.monthly_hours_target)}/mo
      </div>
      <div class="kf-progress-track">
        <div class="kf-progress-fill" style="width:${monthPct}%;background:${monthBarColor}"></div>
      </div>
      <div class="stat-sub ${monthCls}" style="font-size:14px;margin-top:12px;">
        ${fmtHours(Math.abs(monthVar))} ${monthDir} target
      </div>
      <div class="stat-sub" style="margin-top:6px;">
        ${fmtHours(Math.max(monthlyTarget - monthLogged, 0))} remaining this month
      </div>
    </div>

    <div class="card col-12">
      <div class="card-title">Monthly Breakdown</div>
      <div style="display:grid;grid-template-columns:52px 1fr 64px 64px 72px;gap:8px;padding:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#aaa;">
        <span>Month</span><span>Progress</span><span>Logged</span><span>Target</span><span>Variance</span>
      </div>
      ${monthRows}
    </div>
  `;
}

// Weekly quota budget: 5 work days (Mon-Fri) at 20% each, weekends budget nothing.
// Elapsed budget counts whole work days since the window opened plus today's fraction.
function weeklyPace(resetTs, pct, now = new Date()) {
  const start = new Date((resetTs - 7 * 86400) * 1000);
  let days = 0;
  for (let d = new Date(start); d < now; d = new Date(d.getTime() + 86400000)) {
    const end = new Date(Math.min(d.getTime() + 86400000, now.getTime()));
    const dow = d.getDay();
    if (dow >= 1 && dow <= 5) days += (end - d) / 86400000;
  }
  const expected = Math.min(100, days * 20);
  const over = pct - expected;
  const state = over > 15 ? 'fast' : over > 5 ? 'slightly-fast' : 'ok';
  return { expected, over, state };
}

// 5-hour window: budget is linear, 20% per hour from the moment the window opened.
function windowPace(resetTs, pct, now = new Date()) {
  const elapsed = Math.min(5 * 3600, Math.max(0, now.getTime() / 1000 - (resetTs - 5 * 3600)));
  const expected = elapsed / (5 * 3600) * 100;
  const over = pct - expected;
  return { expected, over, state: over > 15 ? 'fast' : over > 5 ? 'slightly-fast' : 'ok' };
}

// ── Highlights: what needs attention, drawn from the other tabs ──────────
async function loadHighlights() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const get = u => fetch(u).then(r => r.json().then(j => { if (!r.ok || j.error) throw new Error(j.error || r.status); return j; }));
  const [fin, kf, ops, briefs, claude] = await Promise.allSettled([
    get('/api/data'), get('/api/kf'), get('/api/ops'), get('/api/pipeline/briefs'), get('/api/claude'),
  ]);
  const items = [];   // { sev: 0 urgent | 1 watch | 2 info, tab, text }
  const add = (sev, tab, text) => items.push({ sev, tab, text });

  if (ops.status === 'fulfilled') {
    const o = ops.value;
    const bad = o.jobs.filter(j => j.status === 'missed');
    if (o.cron !== 'active') add(0, 'ops', `Cron service is ${o.cron}`);
    if (bad.length) add(0, 'ops', `${bad.length} scheduled job${bad.length > 1 ? 's' : ''} missed their last run: ${bad.slice(0, 4).map(j => j.name).join(', ')}${bad.length > 4 ? '…' : ''}`);
  } else add(1, 'ops', 'Ops status unavailable: ' + ops.reason.message);

  if (fin.status === 'fulfilled') {
    const g = fin.value.gnucash || {}, h = fin.value.harvest || {};
    const bf = g.bbva_forecast;
    if (bf && bf.shortfall) add(0, 'finance', `BBVA shortfall: ${fmt(bf.balance)} now, ${fmtSigned(bf.balance_after_30d)} after 30 days (${fmt(bf.due_30d)} due, ${fmt(bf.income_30d)} income expected)`);
    const today = new Date().toISOString().slice(0, 10);
    (h.invoices || []).filter(i => i.state === 'open' && i.due_date && i.due_date < today)
      .forEach(i => add(0, 'finance', `Invoice ${i.number} to ${i.client} overdue: ${fmtNative(i.due_amount, i.currency)} due ${i.due_date}`));
    const soon = (g.upcoming || []).filter(u => u.days <= 7 && u.type !== 'income');
    if (soon.length) add(1, 'finance', `${soon.length} payment${soon.length > 1 ? 's' : ''} in the next 7 days, ${fmt(soon.reduce((a, u) => a + (u.currency === 'EUR' ? u.amount : 0), 0))} EUR: ${soon.slice(0, 3).map(u => u.label).join(', ')}`);
    if (h.uninvoiced && h.uninvoiced.total_eur > 0) add(1, 'finance', `${fmt(h.uninvoiced.total_eur)} tracked but not yet invoiced`);
    add(2, 'finance', `Liquid cash ${fmt(g.liquid_eur)}`);
    (fin.value.errors || []).forEach(e => add(1, 'finance', `${e.source}: ${e.message}`));
  } else add(1, 'finance', 'Financial data unavailable: ' + fin.reason.message);

  if (kf.status === 'fulfilled') {
    const k = kf.value, v = k.year_variance;
    add(Math.abs(v) > 10 ? 0 : v < 0 ? 1 : 2, 'kf', `KF is ${fmtHours(Math.abs(v))} ${v < 0 ? 'behind' : 'ahead of'} pace for ${k.year} (${fmtHours(k.year_hours_logged)} logged)`);
  } else add(1, 'kf', 'KF data unavailable: ' + kf.reason.message);

  if (briefs.status === 'fulfilled') {
    const open = briefs.value.filter(b => ['pending', 'nudged'].includes(b.status));
    const hot = open.filter(b => b.score >= 8);
    if (hot.length) add(1, 'pipeline', `${hot.length} high-score brief${hot.length > 1 ? 's' : ''} (8+) awaiting a decision`);
    add(2, 'pipeline', `${open.length} brief${open.length === 1 ? '' : 's'} pending in total`);
  } else add(1, 'pipeline', 'Pipeline API unreachable: ' + briefs.reason.message);

  if (claude.status === 'fulfilled' && claude.value.weekly_pct != null && claude.value.weekly_reset_ts) {
    const c = claude.value, p = weeklyPace(c.weekly_reset_ts, c.weekly_pct);
    if (p.state !== 'ok') add(p.state === 'fast' ? 0 : 1, 'highlights', `Claude weekly quota burning ${p.state === 'fast' ? 'too fast' : 'slightly fast'}: ${c.weekly_pct}% used vs ${Math.round(p.expected)}% budgeted (5 work days at 20%)`);
  }

  if (claude.status === 'fulfilled' && claude.value.reset_ts) {
    const c = claude.value, p = windowPace(c.reset_ts, c.pct);
    if (p.state !== 'ok') add(p.state === 'fast' ? 1 : 2, 'highlights', `Claude 5-hour window burning ${p.state === 'fast' ? 'too fast' : 'slightly fast'}: ${c.pct}% used vs ${Math.round(p.expected)}% budgeted`);
  }

  items.sort((a, b) => a.sev - b.sev);
  const sevCls = ['badge-urgent', 'badge-soon', 'badge-later'], sevLbl = ['act', 'watch', 'info'];
  const tabName = { highlights: 'Highlights', ops: 'Ops', finance: 'Financial', kf: 'KF Time Budget', pipeline: 'Pipeline' };
  const urgent = items.filter(i => i.sev === 0).length;

  let claudeCard = '';
  if (claude.status === 'fulfilled') {
    const c = claude.value;
    const when = ts => new Date(ts * 1000).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    const bar = p => `<div class="kf-progress-track" style="margin-top:8px;"><div class="kf-progress-fill" style="width:${Math.min(p, 100)}%"></div></div>`;
    let weekly;
    if (c.weekly_pct != null) {
      const pace = c.weekly_reset_ts ? weeklyPace(c.weekly_reset_ts, c.weekly_pct) : null;
      const cls = !pace ? colour(c.weekly_pct) : pace.state === 'fast' ? 'negative' : pace.state === 'slightly-fast' ? 'warning' : 'positive';

         <div class="stat-label">this week${c.weekly_reset_ts ? ' · resets ' + when(c.weekly_reset_ts) : ''}</div>
         <div style="position:relative;"><div class="kf-progress-track" style="margin-top:8px;"><div class="kf-progress-fill" style="width:${Math.min(c.weekly_pct, 100)}%"></div></div>${marker}</div>

      five = `<div class="stat-value ${cls}">${c.pct}%</div>
         <div class="stat-label">current window${c.reset_ts ? ' · resets ' + when(c.reset_ts) : ''}</div>
         <div style="position:relative;"><div class="kf-progress-track" style="margin-top:8px;"><div class="kf-progress-fill" style="width:${Math.min(c.pct, 100)}%"></div></div>${marker}</div>
         <div class="stat-label ${pace && pace.state !== 'ok' ? cls : ''}" style="margin-top:8px;">${verdict}</div>`;
    }
    claudeCard = `
      <div class="card col-3">
        <div class="card-title">Claude usage · weekly</div>${weekly}
      </div>
      <div class="card col-3">
        <div class="card-title">Claude usage · 5-hour</div>${five}
      </div>`;
  } else {
    claudeCard = `<div class="card col-6"><div class="card-title">Claude usage</div><div class="stat-label">${claude.reason.message}</div></div>`;
  }

  document.getElementById('highlightsGrid').innerHTML = `
    <div class="card col-3">
      <div class="card-title">Needs action</div>
      <div class="stat-value ${urgent ? 'negative' : 'positive'}">${urgent}</div>
      <div class="stat-label">${urgent ? 'item' + (urgent > 1 ? 's' : '') + ' flagged across the studio' : 'nothing urgent'}</div>
    </div>
    ${claudeCard}
    <div class="card col-12">
      <div class="card-title">Highlights</div>
      <table class="ops-table"><tbody>
        ${items.map(i => `<tr>
          <td style="width:60px;"><span class="badge ${sevCls[i.sev]}">${sevLbl[i.sev]}</span></td>
          <td>${i.text}</td>
          <td style="text-align:right;"><a href="#${i.tab}" style="color:#999;font-size:11px;">${tabName[i.tab]} →</a></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  document.getElementById('updatedAt').textContent = 'Checked ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  btn.classList.remove('spinning');
}

function opsWhen(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function tailscaleCards(t) {
  if (!t || t.error) {
    return `<div class="card col-6"><div class="card-title">Tailscale</div>
      <div class="stat-value negative">unavailable</div>
      <div class="stat-label">${(t && t.error) || 'no data'}</div></div>`;
  }
  const up = t.state === 'Running';
  const rows = t.peers.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td><code>${p.ip || ''}</code></td>
      <td>${p.os || ''}</td>
      <td><span class="badge ${p.online ? 'badge-later' : 'badge-soon'}">${p.online ? 'online' : 'offline'}</span></td>
      <td>${p.online ? '' : opsWhen(p.last_seen)}</td>
    </tr>`).join('');
  return `
    <div class="card col-3">
      <div class="card-title">Tailscale</div>
      <div class="stat-value ${up ? 'positive' : 'negative'}">${t.state || '?'}</div>
      <div class="stat-label">${t.self.name} · <code>${t.self.ip || ''}</code></div>
    </div>
    <div class="card col-3">
      <div class="card-title">SSH server</div>
      <div class="stat-value ${t.ssh === 'active' ? 'positive' : 'negative'}">${t.ssh || '?'}</div>
      <div class="stat-label">${t.peers.filter(p => p.online).length}/${t.peers.length} other devices online</div>
    </div>
    <div class="card col-12">
      <div class="card-title">Tailnet devices</div>
      <table class="ops-table">
        <thead><tr><th>Device</th><th>IP</th><th>OS</th><th>Status</th><th>Last seen</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderOpsPage(d) {
  const missed = d.jobs.filter(j => j.status === 'missed' || j.status === 'no-log');
  const okCount = d.jobs.filter(j => j.status === 'ok').length;
  const cls = { ok: 'badge-later', missed: 'badge-urgent', 'no-log': 'badge-soon', unknown: 'badge-soon' };
  const label = { ok: 'ran', missed: 'missed', 'no-log': 'no log', unknown: '?' };
  const rows = d.jobs.map(j => `
    <tr>
      <td><strong>${j.log ? `<a href="/ops/log/${encodeURIComponent(j.name)}" target="_blank" style="color:inherit;">${j.name}</a>` : j.name}</strong></td>
      <td><code>${j.schedule}</code></td>
      <td>${opsWhen(j.expected)}</td>
      <td>${opsWhen(j.last_activity)}</td>
      <td><span class="badge ${cls[j.status]}">${label[j.status]}</span></td>
      <td style="color:#888;font-size:11px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${(j.last_line || '').replace(/"/g, '&quot;')}">${j.last_line || ''}</td>
    </tr>`).join('');
  document.getElementById('opsGrid').innerHTML = `
    <div class="card col-3">
      <div class="card-title">Scheduled jobs</div>
      <div class="stat-value ${missed.length ? 'negative' : 'positive'}">${okCount}/${d.jobs.length}</div>
      <div class="stat-label">${missed.length} missed or unlogged since last expected run</div>
    </div>
    <div class="card col-3">
      <div class="card-title">Cron service</div>
      <div class="stat-value ${d.cron === 'active' ? 'positive' : 'negative'}">${d.cron}</div>
      <div class="stat-label">Machine booted ${opsWhen(d.booted)}</div>
    </div>
    <div class="card col-3">
      <div class="card-title">Ops worktree</div>
      <div class="stat-value">${d.ops_tag || 'detached'}</div>
      <div class="stat-label">${d.ops_head || ''} at /home/bain/ops/bain-studio</div>
    </div>
    ${tailscaleCards(d.tailscale)}
    <div class="card col-12">
      <div class="card-title">Crontab vs log activity</div>
      <table class="ops-table">
        <thead><tr><th>Job</th><th>Schedule</th><th>Last expected</th><th>Log last written</th><th>Status</th><th>Last log line</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="stat-label" style="margin-top:10px;">Status is inferred from log file modification time, so a job that runs but writes nothing shows as missed. Cron does not catch up on runs missed while the machine was off.</div>
    </div>`;
  document.getElementById('updatedAt').textContent = 'Checked ' + opsWhen(d.now);
}

async function loadOps() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const res = await fetch('/api/ops');
    const d = await res.json();
    if (!res.ok || d.error) throw new Error(d.error || `Server error ${res.status}`);
    renderOpsPage(d);
  } catch (err) {
    document.getElementById('opsGrid').innerHTML = `
      <div class="card col-12">
        <div class="not-configured" style="color:#c0392b;">${err.message}</div>
      </div>`;
    document.getElementById('updatedAt').textContent = 'Error';
  } finally {
    btn.classList.remove('spinning');
  }
}

let _pipelineBriefs  = [];
let pipelineStatusFilter = 'all';
let pipelineScoreFilter  = 'all';

function scoreClass(s) { return s >= 8 ? 'score-high' : s >= 5 ? 'score-mid' : 'score-low'; }

function statusPillClass(s) {
  const m = { won:'status-won', lost:'status-lost', rejected:'status-rejected',
              interview:'status-interview', waiting:'status-waiting',
              proposal_sent:'status-proposal', nudged:'status-nudged' };
  return m[s] || 'status-pending';
}

function statusLabel(s) {
  const m = { pending:'Pending', nudged:'Nudged', proposal_sent:'Sent',
              waiting:'Waiting', interview:'Interview',
              won:'Won', lost:'Lost', rejected:'Rejected' };
  return m[s] || s;
}

function displayStatus(b) {
  return (b.interview && b.applied) ? 'interview' : b.status;
}

function budgetMin(str) {
  if (!str || str === '—') return 0;
  const nums = str.match(/[\d,]+/g);
  return nums ? parseInt(nums[0].replace(/,/g, ''), 10) : 0;
}

function fmtDateShort(iso) {
  if (!iso) return '—';
  const d = new Date(iso.replace(' ', 'T') + (iso.includes('T') ? '' : 'T00:00:00'));
  if (isNaN(d)) return '—';
  const today = new Date(); today.setHours(0,0,0,0);
  const diff  = Math.round((d - today) / 86400000);
  if (diff === 0)  return 'today';
  if (diff === -1) return 'yest.';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function renderPipelinePage(d, briefs) {
  const f = d.funnel   || {};
  const o = d.outcomes || {};
  const c = d.connects || {};
  const appliedList = c.per_proposal || [];

  const passRateClass = (f.pass_rate >= 40) ? 'positive' : (f.pass_rate >= 20) ? 'warning' : 'negative';
  const winRate  = (o.applied > 0) ? Math.round(o.won / o.applied * 100) : null;
  const winClass = winRate !== null ? (winRate >= 30 ? 'positive' : winRate >= 10 ? 'warning' : 'negative') : 'neutral';
  const totalSpent = c.total_spent ?? 0;
  const avgConn    = appliedList.length ? Math.round(totalSpent / appliedList.length) : 6;

  const inPlay = (briefs || []).filter(b => ['pending','nudged','proposal_sent'].includes(b.status));

  const ts = d.updated_at ? new Date(d.updated_at) : new Date();
  document.getElementById('updatedAt').textContent =
    'Updated ' + ts.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  document.getElementById('pipelineGrid').innerHTML = `
    <div class="card col-3">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>${f.days || pipelineDays}-day Funnel</span>
        <div class="days-toggle">
          <button class="days-btn ${pipelineDays===7?'active':''}" onclick="setPipelineDays(7)">7d</button>
          <button class="days-btn ${pipelineDays===30?'active':''}" onclick="setPipelineDays(30)">30d</button>
        </div>
      </div>
      <div class="stat-value ${passRateClass}">${f.pass_rate ?? '—'}%</div>
      <div class="stat-label">pass rate (seen → proposal)</div>
      <div style="margin-top:14px;">
        <div class="funnel-step"><span class="funnel-count">${f.seen ?? '—'}</span><span class="funnel-label">seen</span></div>
        <div class="funnel-arrow">↓</div>
        <div class="funnel-step"><span class="funnel-count">${f.passed ?? '—'}</span><span class="funnel-label">passed triage</span></div>
        <div class="funnel-arrow">↓</div>
        <div class="funnel-step"><span class="funnel-count">${f.proposals ?? '—'}</span><span class="funnel-label">proposals sent</span></div>
      </div>
    </div>

    <div class="card col-3">
      <div class="card-title">Outcomes</div>
      ${winRate !== null
        ? `<div class="stat-value ${winClass}">${winRate}%</div>
           <div class="stat-label">win rate · ${o.won} won of ${o.applied} applied</div>`
        : `<div class="stat-value neutral">—</div><div class="stat-label">No applications yet</div>`}
      <div class="outcome-grid">
        <div class="outcome-cell"><div class="outcome-val positive">${o.won ?? 0}</div><div class="outcome-lbl">Won</div></div>
        <div class="outcome-cell"><div class="outcome-val warning">${o.interview ?? 0}</div><div class="outcome-lbl">Interview</div></div>
        <div class="outcome-cell"><div class="outcome-val neutral">${o.waiting ?? 0}</div><div class="outcome-lbl">Waiting</div></div>
        <div class="outcome-cell"><div class="outcome-val negative">${o.lost ?? 0}</div><div class="outcome-lbl">Lost</div></div>
        <div class="outcome-cell"><div class="outcome-val negative">${o.rejected ?? 0}</div><div class="outcome-lbl">Rejected</div></div>
        <div class="outcome-cell"><div class="outcome-val neutral">${o.applied ?? 0}</div><div class="outcome-lbl">Applied</div></div>
      </div>
    </div>

    <div class="card col-3">
      <div class="card-title">In Play</div>
      <div class="stat-value">${inPlay.length}</div>
      <div class="stat-label">pending / nudged / sent</div>
      ${inPlay.length > 0 ? `<div style="margin-top:12px;font-size:12px;color:#888;line-height:1.8;">
        <span class="positive">${inPlay.filter(b=>b.score>=8).length} high-score</span> ·
        ${inPlay.filter(b=>b.status==='proposal_sent').length} sent ·
        ${inPlay.filter(b=>b.status==='nudged').length} nudged
      </div>` : ''}
    </div>

    <div class="card col-3">
      <div class="card-title">Connects Spent</div>
      <div class="stat-value">${totalSpent}</div>
      <div class="stat-label">${appliedList.length} proposal${appliedList.length !== 1 ? 's' : ''} · avg ${avgConn}/proposal</div>
    </div>

    <div class="card col-12" id="briefs-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="card-title" style="margin:0;">All Briefs</div>
        <span style="font-size:11px;color:#aaa;" id="briefs-count"></span>
      </div>
      <div class="filter-bar" id="status-filters">
        ${['all','pending','nudged','proposal_sent','waiting','interview','won','lost','rejected'].map(s => {
          const label = s === 'all' ? 'All' : s === 'proposal_sent' ? 'Sent' : statusLabel(s);
          return `<button class="filter-chip ${pipelineStatusFilter===s?'active':''}" data-sf="${s}" onclick="setStatusFilter('${s}')">${label}</button>`;
        }).join('')}
        <span class="filter-sep"></span>
        ${[['all','All score'],['high','High 8+'],['mid','Mid 5–7'],['low','Low <5']].map(([v,l]) =>
          `<button class="filter-chip ${pipelineScoreFilter===v?'active':''}" data-scf="${v}" onclick="setScoreFilter('${v}')">${l}</button>`
        ).join('')}
      </div>
      <div class="briefs-hdr">
        <span>Job</span><span>Budget</span><span>Score</span><span>Status</span>
        <span style="text-align:right;">Connects</span><span style="text-align:right;">Applied</span><span style="text-align:right;">Seen</span>
      </div>
      <div id="briefs-rows"></div>
    </div>
  `;

  renderBriefsTable(briefs || []);
}

function renderBriefsTable(allBriefs) {
  // Filter
  let rows = allBriefs.filter(b => {
    const ds = displayStatus(b);
    const statusOk = pipelineStatusFilter === 'all' || ds === pipelineStatusFilter;
    const scoreOk  = pipelineScoreFilter  === 'all'
      || (pipelineScoreFilter === 'high' && b.score >= 8)
      || (pipelineScoreFilter === 'mid'  && b.score >= 5 && b.score < 8)
      || (pipelineScoreFilter === 'low'  && b.score < 5);
    return statusOk && scoreOk;
  });

  // Sort: score desc → budget desc → hours asc
  rows.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    const bd = budgetMin(b.budget) - budgetMin(a.budget);
    if (bd !== 0) return bd;
    return a.hours - b.hours;
  });

  const countEl = document.getElementById('briefs-count');
  if (countEl) countEl.textContent = `${rows.length} of ${allBriefs.length}`;

  const el = document.getElementById('briefs-rows');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<div class="empty">No briefs match the current filters.</div>'; return; }

  el.innerHTML = rows.map(b => {
    const ds     = displayStatus(b);
    const connCell = b.applied
      ? `<span id="conn-${b.thread_id}" style="text-align:right;display:block;">${connectsBadge(b.thread_id, b.connects, b.connects !== 6)}</span>`
      : `<span class="briefs-dim">—</span>`;
    return `
      <div class="briefs-row">
        <div class="briefs-title">${b.url ? `<a href="${b.url}" target="_blank" rel="noopener">${b.title}</a>` : b.title}</div>
        <div class="briefs-budget" style="font-size:12px;color:#888;">${b.budget || '—'}</div>
        <span class="score-badge ${scoreClass(b.score)}">${b.score}</span>
        <span class="status-pill ${statusPillClass(ds)}">${statusLabel(ds)}</span>
        ${connCell}
        <span class="briefs-dim">${b.applied_at ? fmtDateShort(b.applied_at) : '—'}</span>
        <span class="briefs-dim">${fmtDateShort(b.sent_at)}</span>
      </div>`;
  }).join('');
}

function setStatusFilter(val) { navigate('pipeline', { status: val }); }
function setScoreFilter(val)  { navigate('pipeline', { score:  val }); }

function connectsBadge(threadId, connects, edited) {
  const cls = edited ? 'connects-badge edited' : 'connects-badge';
  return `<span class="${cls}" onclick="editConnects('${threadId}', ${connects})">${connects} ⚡</span>`;
}

function editConnects(threadId, current) {
  const cell = document.getElementById(`conn-${threadId}`);
  cell.innerHTML = `
    <span class="connects-edit-wrap">
      <input class="connects-input" type="number" value="${current}" min="1" max="100">
      <button class="connects-save"  onclick="saveConnects('${threadId}', ${current})">✓</button>
      <button class="connects-cancel" onclick="cancelConnects('${threadId}', ${current})">✗</button>
    </span>`;
  cell.querySelector('input').focus();
  cell.querySelector('input').select();
}

async function saveConnects(threadId, prev) {
  const cell  = document.getElementById(`conn-${threadId}`);
  const input = cell.querySelector('input');
  const val   = parseInt(input.value, 10);
  if (isNaN(val) || val < 1) { cancelConnects(threadId, prev); return; }
  try {
    const res = await fetch(`/api/pipeline/connects/${threadId}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({connects: val}),
    });
    if (!res.ok) throw new Error('Save failed');
    cell.innerHTML = connectsBadge(threadId, val, val !== 6);
  } catch {
    cell.innerHTML = connectsBadge(threadId, prev, prev !== 6);
  }
}

function cancelConnects(threadId, prev) {
  document.getElementById(`conn-${threadId}`).innerHTML = connectsBadge(threadId, prev, prev !== 6);
}

async function loadPipeline() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const [statusRes, briefsRes] = await Promise.all([
      fetch(`/api/pipeline?days=${pipelineDays}`),
      fetch('/api/pipeline/briefs'),
    ]);
    if (!statusRes.ok) throw new Error(`Status error ${statusRes.status}`);
    if (!briefsRes.ok) throw new Error(`Briefs error ${briefsRes.status}`);
    const [d, briefs] = await Promise.all([statusRes.json(), briefsRes.json()]);
    if (d.error) throw new Error(d.error);
    if (briefs.error) throw new Error(briefs.error);
    _pipelineBriefs = Array.isArray(briefs) ? briefs : [];
    renderPipelinePage(d, _pipelineBriefs);
  } catch (err) {
    document.getElementById('pipelineGrid').innerHTML = `
      <div class="card col-12">
        <div class="not-configured" style="color:#c0392b;">${err.message}</div>
      </div>`;
    document.getElementById('updatedAt').textContent = 'Error';
  } finally {
    btn.classList.remove('spinning');
  }
}

function setPipelineDays(days) { navigate('pipeline', { days: String(days) }); }
