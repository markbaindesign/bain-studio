function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function eur2(n) {
  const sign = n < 0 ? '−' : '';
  return sign + '€' + Math.abs(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function shortDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

const TIER_LABELS = {
  receivable: 'Invoices sent', unbilled: 'Unbilled hours', fixed: 'Fixed recurring',
  predicted: 'Predicted', milestone: 'Milestones', expected: 'Expected (manual)',
};
const TIER_ORDER = ['receivable', 'unbilled', 'fixed', 'expected', 'predicted', 'milestone'];

function accountName(n) { return n.replace(/^Wise:Wise \(Business\):/, '').replace(/^Wise:Wise \(Personal\):/, ''); }

function setScenario(v) { navigate('finance', { scenario: v }, 'cashflow'); }

function renderCashflowPage(d, scenario) {
  const sc = d[scenario];
  const other = d[scenario === 'base' ? 'all' : 'base'];
  const baseTiers = d.base_tiers;

  const chips = [['base', 'Base case'], ['all', 'With upside']].map(([v, l]) =>
    `<button class="filter-chip ${scenario === v ? 'active' : ''}" onclick="setScenario('${v}')">${l}</button>`).join('');

  // First dip and lowest point per account: the first dip can be cents, the low much deeper.
  const short = sc.shortfalls.length
    ? sc.shortfalls.map(f => {
        const acct = sc.accounts.find(a => a.name === f.account);
        const low = acct ? acct.rows.reduce((m, r) => (r.balance < m.balance ? r : m), acct.rows[0]) : null;
        const lowText = low && low.balance < f.balance - 0.005
          ? `, lowest ${eur2(low.balance)} on ${shortDate(low.date)} (${esc(low.label)})` : '';
        return `<div class="note"><span class="note-warn">${esc(accountName(f.account))}</span> first goes negative on ${shortDate(f.date)} (${eur2(f.balance)}, ${esc(f.label)})${lowText}</div>`;
      }).join('')
    : `<div class="note positive">Every account stays positive to ${shortDate(d.window_end)}.</div>`;
  const otherNote = scenario === 'base'
    ? (other.shortfalls.length ? 'Still short with predicted income and milestones too.' : 'Covered if predicted income and milestones land.')
    : (other.shortfalls.length ? 'The base case alone runs short; this view depends on predicted income and milestones.' : 'The base case alone also stays positive.');
  const missing = (d.income_sources_missing || []).length
    ? `<div class="note note-warn" style="margin-top:8px">Income incomplete: ${d.income_sources_missing.map(esc).join(', ')} unavailable.</div>` : '';

  const tierRows = TIER_ORDER.filter(t => d.income_by_tier[t] !== undefined).map(t => {
    const inBase = t === 'expected' || baseTiers.includes(t);
    return `<tr><td><span class="tier tier-${t}">${TIER_LABELS[t]}</span></td>
      <td>${inBase ? 'Base' : 'Upside'}</td><td class="num">${eur2(d.income_by_tier[t])}</td></tr>`;
  }).join('');

  const accounts = sc.accounts.map(a => {
    const rows = a.rows.map(r => `
      <tr class="${r.shortfall ? 'shortfall' : ''}">
        <td>${shortDate(r.date)}</td>
        <td class="cell-wrap">${esc(r.label)}</td>
        <td><span class="tier tier-${esc(r.type)}">${esc(r.type)}</span></td>
        <td class="num ${r.amount > 0 ? 'positive' : ''}">${r.amount > 0 ? '+' : ''}${eur2(r.amount)}</td>
        <td class="num ${r.balance < 0 ? 'negative' : ''}">${eur2(r.balance)}${r.shortfall ? ' ⚠' : ''}</td>
      </tr>`).join('');
    const end = a.rows.length ? a.rows[a.rows.length - 1].balance : a.start;
    return `
      <div class="card col-12">
        <div class="card-title">${esc(accountName(a.name))} · start ${eur2(a.start)} · end ${eur2(end)}</div>
        <div class="table-scroll"><table class="ops-table">
          <thead><tr><th>Date</th><th>Label</th><th>Type</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
  }).join('');

  const unassigned = sc.unassigned.length ? `
    <div class="card col-12">
      <div class="card-title">Unassigned (no account attributed)</div>
      <table class="ops-table"><thead><tr><th>Date</th><th>Label</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>
      ${sc.unassigned.map(u => `<tr><td>${shortDate(u.date)}</td><td class="cell-wrap">${esc(u.label)}</td><td>${esc(u.type)}</td><td class="num">${eur2(u.amount)}</td></tr>`).join('')}
      </tbody></table>
    </div>` : '';

  document.getElementById('cashflowGrid').innerHTML = `
    <div class="card col-12">
      <div class="card-title">All accounts · running balance to ${shortDate(d.window_end)} · ${scenario === 'base' ? 'base case' : 'with upside'}</div>
      <div class="chart-wrap" style="height:300px;"><canvas id="cashflowChart" role="img"
        aria-label="Running balance of each bank account over the forecast window; the tables below give every figure"></canvas></div>
    </div>
    <div class="card col-6">
      <div class="card-title">Cashflow to ${shortDate(d.window_end)}</div>
      <div class="filter-bar">${chips}</div>
      ${short}
      <div class="note" style="margin-top:6px">${otherNote}</div>
      ${missing}
      <div class="note" style="margin-top:10px;color:var(--pencil)">BBVA shortfalls are covered by a predicted transfer from Wise USD on the day.</div>
    </div>
    <div class="card col-6">
      <div class="card-title">Forecast income by tier</div>
      <table class="ops-table"><thead><tr><th>Tier</th><th>Counts in</th><th class="num">Total</th></tr></thead><tbody>${tierRows}</tbody></table>
    </div>
    ${accounts}
    ${unassigned}
  `;
  renderCashflowChart(sc.accounts, d.window_end);
}

// Categorical slots 1-3 of the dataviz reference palette, validated all-pairs on the
// white card surface (CVD ΔE 9.2, normal-vision 24.0). Aqua is under 3:1 contrast, so
// lines carry direct end labels and the tables below are the table view.
const ACCOUNT_COLORS = ['#2a78d6', '#eb6834', '#1baf7a'];
let cashflowChart;

// Draws each account's name at its line's last point, nudged apart so labels never overlap.
const endLabels = {
  id: 'endLabels',
  afterDatasetsDraw(chart) {
    const { ctx, chartArea } = chart;
    const labels = chart.data.datasets.map((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || !meta.data.length) return null;
      const pt = meta.data[meta.data.length - 1];
      return { text: ds.label, color: ds.borderColor, x: pt.x, y: pt.y };
    }).filter(Boolean).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) {
      labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 15);
    }
    ctx.save();
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.textBaseline = 'middle';
    labels.forEach(l => {
      ctx.fillStyle = l.color;
      ctx.fillRect(chartArea.right + 8, l.y - 4, 8, 8);
      ctx.fillStyle = '#3D3D3A';
      ctx.fillText(l.text, chartArea.right + 20, l.y);
    });
    ctx.restore();
  },
};

function renderCashflowChart(accounts, windowEnd) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dayOf = iso => Math.round((new Date(iso + 'T00:00:00') - today) / 86400000);
  const dateOf = n => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
  const lastDay = dayOf(windowEnd);

  // One point per day for every account (end-of-day balance, carried forward), so the
  // hover tooltip reads the same date across all accounts.
  const datasets = accounts.map((a, i) => {
    const byDay = new Map();
    a.rows.forEach(r => byDay.set(dayOf(r.date), r.balance));
    const pts = [];
    let bal = a.start;
    for (let x = 0; x <= lastDay; x++) {
      if (byDay.has(x)) bal = byDay.get(x);
      pts.push({ x, y: bal });
    }
    const color = ACCOUNT_COLORS[i % ACCOUNT_COLORS.length];
    return {
      label: accountName(a.name).replace(/ \.\.\.\d+$/, ''),
      data: pts, stepped: 'before', borderColor: color, backgroundColor: color,
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 10,
    };
  });

  // End labels need ~150px; on a narrow screen the legend alone names the lines.
  const canvas = document.getElementById('cashflowChart');
  const wide = canvas.parentElement.clientWidth >= 600;
  if (cashflowChart) cashflowChart.destroy();
  cashflowChart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    plugins: wide ? [endLabels] : [],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { right: wide ? 150 : 0 } },
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 }, color: '#3D3D3A' } },
        tooltip: {
          mode: 'index', intersect: false,
          callbacks: {
            title: items => dateOf(items[0].parsed.x).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
            label: item => ` ${item.dataset.label}: ${eur2(item.parsed.y)}`,
          },
        },
      },
      scales: {
        x: {
          type: 'linear', min: 0, max: lastDay,
          grid: { display: false },
          ticks: { stepSize: 7, color: '#8C8A85', font: { size: 11 },
                   callback: v => dateOf(v).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) },
        },
        y: {
          grid: { color: c => c.tick.value === 0 ? '#3D3D3A' : '#EEEAE2', lineWidth: c => c.tick.value === 0 ? 1.5 : 1 },
          border: { display: false },
          ticks: { color: '#8C8A85', font: { size: 11 }, callback: v => eur2(v).replace('.00', '') },
        },
      },
    },
  });
}

async function loadCashflow(scenario) {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const res = await fetch('/api/cashflow');
    const d = await res.json();
    if (!res.ok) throw new Error((d.errors || []).map(e => `${e.source}: ${e.message}`).join(' | ') || `Server error ${res.status}`);
    const banner = document.getElementById('errorBanner');
    banner.style.display = d.errors && d.errors.length ? 'block' : 'none';
    banner.textContent = (d.errors || []).map(e => `${e.source}: ${e.message}`).join('  |  ');
    document.getElementById('updatedAt').textContent =
      'Updated ' + new Date(d.generated_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    renderCashflowPage(d, scenario === 'all' ? 'all' : 'base');
  } catch (err) {
    const banner = document.getElementById('errorBanner');
    banner.style.display = 'block';
    banner.textContent = 'Failed to load cashflow: ' + err.message;
  } finally {
    btn.classList.remove('spinning');
  }
}

// ---------------------------------------------------------------------------
// Financial > Configs — every finance YAML file, rendered as tables (read-only)
// ---------------------------------------------------------------------------

function isScalar(v) { return v === null || typeof v !== 'object'; }

function cfgCell(v) {
  if (isScalar(v)) return esc(v === null ? '' : v);
  if (Array.isArray(v) && v.every(isScalar)) return v.map(esc).join(', ');
  return cfgValue(v);
}

function cfgColumns(objs) {
  const cols = [];
  objs.forEach(o => Object.keys(o).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  return cols;
}

function cfgTable(head, rows) {
  return `<div class="table-scroll"><table class="ops-table">
    <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td class="cell-wrap">${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function cfgValue(v) {
  if (isScalar(v)) return `<div class="note">${esc(v)}</div>`;
  if (Array.isArray(v)) {
    if (!v.length) return '<div class="cfg-none">None</div>';
    if (v.every(x => x && typeof x === 'object' && !Array.isArray(x))) {
      const cols = cfgColumns(v);
      return cfgTable(cols, v.map(o => cols.map(c => cfgCell(o[c]))));
    }
    return cfgTable(['value'], v.map(x => [cfgCell(x)]));
  }
  const entries = Object.entries(v);
  if (!entries.length) return '<div class="cfg-none">None</div>';
  // A map of records (e.g. overheads: name -> {amount, ...}) reads best as one table.
  if (entries.every(([, x]) => x && typeof x === 'object' && !Array.isArray(x))) {
    const cols = cfgColumns(entries.map(([, x]) => x));
    return cfgTable(['key', ...cols], entries.map(([k, x]) => [esc(k), ...cols.map(c => cfgCell(x[c]))]));
  }
  return cfgTable(['setting', 'value'], entries.map(([k, x]) => [esc(k), cfgCell(x)]));
}

function renderConfigFile(f) {
  if (f.error) {
    return `<div class="card col-12"><div class="card-title">${esc(f.file)}</div><div class="note note-warn">Could not parse: ${esc(f.error)}</div></div>`;
  }
  const data = { ...f.data };
  const desc = data.description; delete data.description; delete data.name;
  const scalars = Object.entries(data).filter(([, v]) => isScalar(v));
  const sections = Object.entries(data).filter(([, v]) => !isScalar(v));
  const mod = new Date(f.modified).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `
    <div class="card col-12" id="cfg-${esc(f.file.replace(/\W/g, '-'))}">
      <div class="card-title">${esc(f.file)}</div>
      <div class="cfg-meta">${esc(f.path)} · modified ${mod}</div>
      ${desc ? `<div class="cfg-desc">${esc(desc)}</div>` : ''}
      ${scalars.length ? `<div class="cfg-section">Settings</div>${cfgTable(['setting', 'value'], scalars.map(([k, v]) => [esc(k), cfgCell(v)]))}` : ''}
      ${sections.map(([k, v]) => `<div class="cfg-section">${esc(k)}</div>${cfgValue(v)}`).join('')}
    </div>`;
}

async function loadConfigs() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const res = await fetch('/api/configs');
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const d = await res.json();
    document.getElementById('errorBanner').style.display = 'none';
    document.getElementById('updatedAt').textContent = 'Read-only · edit the YAML files to change';
    const index = d.files.map(f =>
      `<button class="filter-chip" onclick="document.getElementById('cfg-${esc(f.file.replace(/\W/g, '-'))}').scrollIntoView({behavior:'smooth'})">${esc(f.file)}</button>`).join('');
    document.getElementById('configsGrid').innerHTML = `
      <div class="card col-12">
        <div class="card-title">Finance configs</div>
        <div class="cfg-meta" style="margin-top:0">${esc(d.dir)}</div>
        <div class="filter-bar" style="margin-bottom:0">${index}</div>
      </div>
      ${d.files.map(renderConfigFile).join('')}`;
  } catch (err) {
    const banner = document.getElementById('errorBanner');
    banner.style.display = 'block';
    banner.textContent = 'Failed to load configs: ' + err.message;
  } finally {
    btn.classList.remove('spinning');
  }
}
